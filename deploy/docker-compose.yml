# SCROLLECT local/dev stack (spec §1.2: Postgres + Redis; backend optional).
# Usage: docker compose -f deploy/docker-compose.yml up -d postgres redis
#        then run the backend locally: cd backend && cp .env.example .env && npm run migrate && npm run dev
# Or bring up everything: docker compose -f deploy/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scrollect
      POSTGRES_PASSWORD: scrollect
      POSTGRES_DB: scrollect
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scrollect -d scrollect"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://scrollect:scrollect@postgres:5432/scrollect
      REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
